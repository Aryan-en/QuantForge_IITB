# QuantForge backend stack.
#   export QF_MCP_TOKEN=$(openssl rand -hex 24)
#   WORKSPACE=/path/to/repo docker compose up --build
# TrueForge UI: http://localhost:8790 (add your model provider and API key there; keys never go in this file).
services:
  mcp:
    build: { context: ., target: mcp }
    environment:
      QF_MCP_TOKEN: ${QF_MCP_TOKEN:?set QF_MCP_TOKEN (e.g. openssl rand -hex 24)}
    volumes:
      - ${WORKSPACE:?set WORKSPACE to the repo folder to edit}:/workspace
      - qf-data:/data
    ports:
      - "127.0.0.1:${TF_PORT:-8790}:8790"   # TrueForge UI/API, published here because trueforge shares this network namespace
    restart: unless-stopped

  trueforge:
    build: { context: ., target: trueforge }
    # Shares the mcp container's network namespace so the loopback-only tool server is reachable at 127.0.0.1:8787.
    network_mode: "service:mcp"
    environment:
      OUTBOUND_URL_ALLOWED_HOSTS: '["127.0.0.1","host.docker.internal"]'
      HOST: "0.0.0.0"   # inside the container only; the host port is published on 127.0.0.1
      MODEL_HTTP_HEADERS_TIMEOUT_MS: "300000"
    volumes:
      - tf-data:/tfdata
    depends_on: [mcp]
    restart: unless-stopped

volumes:
  qf-data:
  tf-data:
